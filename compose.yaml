# Every image is pinned by digest, not by tag.
#
# A tag is a moving pointer. `odoo:18.0` today and `odoo:18.0` in three months are not
# guaranteed to be the same image, so a rebuild can ship something that was never tested.
# A digest cannot move.
#
# To update deliberately:
#   docker pull odoo:18.0
#   docker inspect --format='{{index .RepoDigests 0}}' odoo:18.0
# then paste the result below and open a pull request, so CI runs against the new image
# before it reaches production.

services:
  db:
    image: postgres:16@sha256:REPLACE_WITH_DIGEST
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  odoo:
    image: odoo:18.0@sha256:REPLACE_WITH_DIGEST
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${DB_USER}
      PASSWORD: ${DB_PASSWORD}
    volumes:
      - odoo_filestore:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
    healthcheck:
      # /web/health is a real Odoo endpoint. A container that is running is not
      # the same as an Odoo that is serving.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine@sha256:REPLACE_WITH_DIGEST
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/odoo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  db_data:
  odoo_filestore:

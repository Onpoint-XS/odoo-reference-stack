line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "B", "UP", "C4"]

[lint.per-file-ignores]
# Odoo loads a module by importing its package, and every submodule is pulled in by a
# bare `from . import x` in __init__.py. Nothing references those names afterwards, so
# F401 fires on every Odoo module ever written. It is the framework's loading
# convention, not an unused import.
"**/__init__.py" = ["F401"]

# An Odoo manifest is a bare dict literal that the framework reads and evaluates. To a
# generic Python linter it looks like an expression statement whose value is discarded,
# which is what B018 is for. Every Odoo module has one.
"**/__manifest__.py" = ["B018"]

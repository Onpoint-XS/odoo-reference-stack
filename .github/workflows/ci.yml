name: CI

# Every pull request. No exceptions, no skip label, no "it's just a config change".
# The value of a gate is entirely in it never being bypassed.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install ruff pylint-odoo

      - name: ruff
        run: ruff check addons/

      - name: pylint-odoo
        # Catches the Odoo-specific mistakes a generic Python linter cannot see:
        # SQL built by string interpolation, translations built by concatenation,
        # deprecated API usage, manifest problems.
        #
        # --disable=all before --enable=odoolint matters. On its own, -e ADDS to
        # pylint's defaults rather than replacing them, so the run also demands module
        # docstrings and fails on `import odoo`, which is not installed here and is not
        # supposed to be.
        #
        # The three trailing disables are OCA repository conventions rather than Odoo
        # ones: requiring OCA as manifest author, restricting the licence to their
        # allowlist, and requiring a per-module README.rst. Correct inside OCA, wrong
        # here.
        run: |
          pylint --load-plugins=pylint_odoo \
            --disable=all \
            --enable=odoolint \
            --disable=manifest-required-author,license-allowed,missing-readme \
            addons/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      - name: Run the Odoo test suite
        # -i installs the module and runs its tests against a real PostgreSQL.
        # --test-enable without --stop-after-init hangs forever in CI.
        #
        # HOST/USER/PASSWORD are env vars rather than flags on purpose. The official
        # Odoo image entrypoint builds its own connection arguments from these and
        # defaults HOST to "db", and what it builds wins over --db_host passed on the
        # command line. Setting the flags alone produces "could not translate host
        # name db", which reads like a networking problem and is not one.
        env:
          PGHOST: localhost
        run: |
          docker run --rm --network host \
            -e HOST=localhost \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "${PWD}/addons:/mnt/extra-addons:ro" \
            odoo:18.0 \
            odoo -d ci_test \
              -i reference_health \
              --test-enable --test-tags=/reference_health \
              --stop-after-init \
              --log-level=test 2>&1 | tee odoo.log
          # --test-tags=/reference_health scopes the run to this module. Without it
          # Odoo runs its own entire suite, 1,348 tests, and several of those fail in
          # a bare container for want of Chrome and websocket-client. Those failures
          # say nothing about our code, and a gate that is red for reasons nobody can
          # act on gets ignored, then bypassed, then removed.
          #
          # Odoo also exits 0 on a failed test in some versions, so the summary line
          # in the log is the real source of truth rather than the exit code.
          if ! grep -qE 'odoo\.tests\.result: 0 failed, 0 error' odoo.log; then
            echo "::error::Odoo did not report a clean test run"
            exit 1
          fi

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a changed module did not bump its version
        # The single most common cause of a deploy that reports success and changes
        # nothing. Catching it here is cheaper than catching it with the post-deploy
        # assertion, and far cheaper than catching it in production a week later.
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD -- addons/ \
                    | cut -d/ -f2 | sort -u)
          status=0
          for module in ${changed}; do
            [ -f "addons/${module}/__manifest__.py" ] || continue
            if ! git diff origin/${{ github.base_ref || 'main' }}...HEAD -- \
                 "addons/${module}/__manifest__.py" | grep -q '^+.*version'; then
              echo "::error::${module} changed but its manifest version did not move"
              status=1
            fi
          done
          exit ${status}

# Odoo behind Nginx.
#
# proxy_mode = True must be set in odoo.conf as well, or Odoo builds absolute URLs from
# the internal address and password reset emails point at localhost.

upstream odoo      { server odoo:8069; }
upstream odoochat  { server odoo:8072; }

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Odoo exports and large report generation genuinely take minutes. A 60 second
    # default here produces "the export is broken" tickets that are really timeouts.
    proxy_read_timeout    720s;
    proxy_send_timeout    720s;
    proxy_connect_timeout 720s;

    client_max_body_size 200m;

    # The database manager stays unreachable from outside. Belt and braces alongside
    # list_db = False in odoo.conf.
    location ~ ^/web/database/(manager|selector) {
        return 404;
    }

    location /websocket {
        proxy_pass http://odoochat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /longpolling {
        proxy_pass http://odoochat;
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    location ~* /web/static/ {
        proxy_cache_valid 200 90m;
        proxy_pass http://odoo;
        expires 864000;
    }

    gzip on;
    gzip_min_length 1100;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json;
}

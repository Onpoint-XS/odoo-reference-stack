[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; The database manager is a remote code execution surface and a data exfiltration
; surface. There is no reason for it to be reachable in production.
list_db = False

; Workers. 0 means threaded mode, which is fine for development and wrong for
; production. Rule of thumb: (2 * cores) + 1, then leave one worker's worth of
; RAM spare. Set this to match the machine you are actually on.
workers = 5
max_cron_threads = 2

; Memory limits per worker. A worker that exceeds the hard limit is killed, which
; is preferable to a machine that starts swapping.
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Long-running cron jobs holding locks during business hours is one of the most
; common causes of "Odoo is slow" that has nothing to do with the server.
limit_time_real_cron = 3600

proxy_mode = True

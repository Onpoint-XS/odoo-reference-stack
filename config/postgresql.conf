# Tuned for a 16GB machine running Odoo and PostgreSQL together.
# These are starting points, not truths. Measure before changing them.

listen_addresses = '*'
max_connections = 100

shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
maintenance_work_mem = 512MB

# Odoo writes a great deal. Spreading checkpoints avoids the periodic stall
# that gets misdiagnosed as "the server is too small".
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

random_page_cost = 1.1
effective_io_concurrency = 200

# Autovacuum left at defaults is why a two-year-old Odoo database is bloated.
# Odoo's write patterns need it to run more often than the defaults assume.
autovacuum = on
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 30s

# Anything slower than a second is worth knowing about.
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
